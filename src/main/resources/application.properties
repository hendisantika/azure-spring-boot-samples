# Azure Cosmos DB (Spring Cloud Azure)
# Override via environment variables: AZURE_COSMOS_ENDPOINT, AZURE_COSMOS_KEY, AZURE_COSMOS_DATABASE
spring.cloud.azure.cosmos.endpoint=${AZURE_COSMOS_ENDPOINT:https://your-account.documents.azure.com:443/}
spring.cloud.azure.cosmos.key=${AZURE_COSMOS_KEY:put-your-cosmosdb-key-here}
spring.cloud.azure.cosmos.database=${AZURE_COSMOS_DATABASE:put-your-cosmosdb-databasename-here}
